<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}</style></head><body><canvas id="cv"></canvas><script>
// Torchless heat motion, app host. The app tells this page what the rig is doing (TL.set / TL.ev);
// the page only draws. It never talks to the rig and has no network access.
(function(){
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const W=340,H=300,cx=W/2,cy=H/2,R=110,D=Math.PI/180;
const FX=window.FX={W,H,cx,cy,R,D,LIVE:[95,230,255],GOLD:[255,194,77],ICE:[115,184,255],HOT:[255,120,40],layers:[],
  rgba:(a,o)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${Math.max(0,Math.min(1,o))})`,
  mix:(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k],
  clamp:(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),
  ease:{out:k=>1-Math.pow(1-k,3),inOut:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,back:k=>{const s=1.70158;return 1+(s+1)*Math.pow(k-1,3)+s*Math.pow(k-1,2)},elastic:k=>k<=0?0:k>=1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*2.0944)+1},
  radial(c,x,y,rad,stops){const g=c.createRadialGradient(x,y,0,x,y,Math.max(.01,rad));stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g},
  ring(c,rr,col,lw,a0,a1){c.beginPath();c.arc(cx,cy,Math.max(.01,rr),a0===undefined?0:a0,a1===undefined?6.2832:a1);c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.stroke()},
  arcAngle:f=>(135+270*f)*D,
  add(l){FX.layers.push(l)},
  VIS:{x0:13,y0:19,x1:327,y1:281}   // the part of the 340 x 300 design space the app's card shows (dial radius 126)
};
const S=FX.S={t:0,dt:0,phase:0,pt:0,dur:1,k:0,energy:0,temp:70,target:520,tempFrac:0,holdFrac:1,coolFrac:0,lastFive:false,secondsLeft:0,look:'clean',reduce:false,shake:0,
  kick(px){S.shake=Math.min(10,Math.max(S.shake,px))}};
const PALETTE={clean:[[95,230,255],[255,194,77],[255,120,40]],chimes:[[95,230,255],[255,194,77],[255,120,40]],torch:[[255,150,50],[255,80,24],[255,220,150]],ember:[[255,140,60],[255,90,36],[255,200,120]],
 storm:[[150,185,255],[205,175,255],[235,240,255]],reactor:[[95,230,255],[170,120,255],[200,250,255]],kettle:[[130,205,255],[230,244,255],[255,170,90]],
 ignition:[[90,215,255],[255,70,170],[190,120,255]],lofi:[[255,180,125],[255,140,175],[255,225,190]],arcade:[[80,255,130],[255,80,220],[255,235,60]],zen:[[125,220,172],[245,235,200],[255,180,200]]};
const GAIN={clean:{heating:0,hold:0,moments:0,cooldown:0},chimes:{heating:.6,hold:.8},ember:{heating:.22,hold:.45,moments:.5},ignition:{heating:.22,hold:.4,moments:.5},torch:{heating:.2,hold:.4,moments:.5},lofi:{heating:.2,hold:.4,moments:.45},arcade:{heating:.2,hold:.4,moments:.45},reactor:{heating:.3,hold:.45,moments:.55},kettle:{heating:.2,hold:.4,moments:.45},zen:{heating:.18,hold:.35,moments:.4},storm:{heating:.25,hold:.5,moments:.5}};
function applyPalette(){const p=PALETTE[S.look]||PALETTE.clean;[FX.LIVE,FX.GOLD,FX.HOT].forEach((a,i)=>{a[0]=p[i][0];a[1]=p[i][1];a[2]=p[i][2]})}
function active(l){return !l.looks||l.looks.includes(S.look)}
function fire(ev){FX.layers.forEach(l=>{if(l.on&&active(l)){try{l.on(ev,S)}catch(e){}}})}
function pass(name,comp){c.globalCompositeOperation=comp;FX.layers.forEach(l=>{if(l.draw&&active(l)){const g=(GAIN[S.look]||{})[l.id];if(g===0)return;c.save();if(g!==undefined)c.globalAlpha=g;try{l.draw(c,S,name)}catch(e){}c.restore();c.globalCompositeOperation=comp;c.globalAlpha=1}})}

// what the app last told us; the page eases toward it between updates
const G={phase:0,energy:0,temp:70,target:520,tempFrac:0,holdFrac:1,holdDur:60,secondsLeft:0,coolFrac:0,lastFive:false};
const geo={w:340,h:300,R:110};let dpr=1,running=false,idleFor=0,last=0,sweep=-1,first=true;
const COOL_SHOW=40;   // the cooldown show plays out over at most this many seconds, then rests until the glass is cool
function fit(){dpr=Math.min(2,window.devicePixelRatio||1);geo.w=window.innerWidth||340;geo.h=window.innerHeight||300;cv.width=Math.max(1,Math.round(geo.w*dpr));cv.height=Math.max(1,Math.round(geo.h*dpr))}
window.addEventListener('resize',()=>{fit();wake()});
function setPhase(p,quiet){const from=S.phase;S.phase=p;S.pt=quiet?1.5:0;
  if(quiet){if(p===2||p===1)S.energy=G.energy;S.temp=G.temp;S.tempFrac=G.tempFrac;S.holdFrac=G.holdFrac;S.coolFrac=p===3?Math.max(.03,G.coolFrac):0;S.k=p===1?G.energy:0;return}
  if(p===1){S.k=0;fire('start')}
  else if(p===2){S.holdFrac=1;fire('ready')}
  else if(p===3){S.coolFrac=1;fire('done')}
  else if(p===0){S.coolFrac=0;if(from===3)fire('cooled')}}
function wake(){if(window.FX_MANUAL||running)return;running=true;last=0;requestAnimationFrame(frame)}
window.TL={
  // state from the app: {look, reduce, R, phase, energy, temp, target, tempFrac, holdFrac, holdDur, secondsLeft, coolFrac, lastFive}
  set(o){
    if(o.look&&o.look!==S.look){S.look=PALETTE[o.look]?o.look:'clean';applyPalette();fire('look')}
    if(o.reduce!==undefined)S.reduce=!!o.reduce;
    if(o.R>20)geo.R=o.R;
    for(const k in G)if(typeof o[k]===typeof G[k]&&o[k]===o[k])G[k]=o[k];
    if(G.phase!==S.phase)setPhase(G.phase,first);
    first=false;
    if(S.phase!==0)wake();
  },
  ev(name){if(name==='tick'){fire('tick');wake()}else if(name==='sweep'){sweep=0;wake()}},
  _frame:frame
};
function frame(now){
  if(!window.FX_MANUAL&&!running)return;
  const dt=last?Math.min(.05,Math.max(0,(now-last)/1000)):0;last=now;S.t=now/1000;S.dt=dt;S.pt+=dt;
  S.target=G.target;
  S.energy+=(G.energy-S.energy)*Math.min(1,dt*(G.energy>S.energy?3:1.2));
  S.temp+=(G.temp-S.temp)*Math.min(1,dt*4);
  S.tempFrac+=(G.tempFrac-S.tempFrac)*Math.min(1,dt*4);
  S.lastFive=false;
  if(S.phase===1){S.k+=(G.energy-S.k)*Math.min(1,dt*3);S.dur=Math.max(8,S.pt/Math.max(.05,S.k))}
  else if(S.phase===2){S.holdFrac+=(G.holdFrac-S.holdFrac)*Math.min(1,dt*3);S.secondsLeft=G.secondsLeft;S.lastFive=G.lastFive;S.k=1-S.holdFrac;S.dur=Math.max(1,G.holdDur)}
  else if(S.phase===3){const show=Math.max(.03,Math.min(G.coolFrac,1-S.pt/COOL_SHOW));S.coolFrac+=(show-S.coolFrac)*Math.min(1,dt*3);S.k=1-S.coolFrac;S.dur=COOL_SHOW}
  else{S.k=0}
  idleFor=S.phase===0?idleFor+dt:0;
  S.shake=Math.max(0,S.shake-dt*30);
  FX.layers.forEach(l=>{if(l.step&&active(l)){try{l.step(dt,S)}catch(e){}}});
  c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;c.clearRect(0,0,cv.width,cv.height);
  if(S.phase===0&&idleFor>7&&sweep<0){running=false;return}
  const s=geo.R/R;let sx=0,sy=0;if(S.shake>0.05&&!S.reduce){sx=(Math.random()-.5)*S.shake;sy=(Math.random()-.5)*S.shake}
  c.setTransform(dpr*s,0,0,dpr*s,dpr*(geo.w/2+(sx-cx)*s),dpr*(geo.h/2+(sy-cy)*s));
  pass('under','source-over');pass('glow','lighter');pass('over','source-over');
  if(sweep>=0){sweep+=dt;const a=sweep;
    if(a>=1.9)sweep=-1;
    else if(!S.reduce){let x=1;if(a<.75)x=1-Math.pow(1-a/.75,3);else if(a>=1)x=1-Math.pow((a-1)/.9,2);
      if(x>.01){c.globalCompositeOperation='lighter';FX.ring(c,R-2,FX.rgba(FX.LIVE,.25),9,135*D,(135+270*x)*D);FX.ring(c,R-2,FX.rgba(FX.LIVE,.85),3,135*D,(135+270*x)*D);c.globalCompositeOperation='source-over'}}}
  if(!window.FX_MANUAL)requestAnimationFrame(frame);
}
// ---- clean.js
(function(){
// clean.js : the clean, basic look. A few quiet lines and glows, nothing flying around.
const cx = FX.cx, cy = FX.cy, R = FX.R, TAU = Math.PI * 2;
const clamp = FX.clamp, rgba = FX.rgba, mix = FX.mix, eOut = FX.ease.out;
const WHITE = [255, 255, 255], ICE = [150, 200, 255];
let amp = 0, e = 0, tr = 9, td = 9, tc = 9, hold = 0, cool = 0, hf = 1, cf = 0, tf = 0;
FX.add({
  id: 'sig-clean', looks: ['clean'],
  init() {},
  on(ev, S) {
    if (ev === 'look') { amp = e = hold = cool = 0; tr = td = tc = 9; return; }
    if (ev === 'ready') tr = 0; else if (ev === 'done') td = 0; else if (ev === 'cooled') tc = 0;
  },
  step(dt, S) {
    const ph = S.phase;
    amp += ((ph ? 1 : 0) - amp) * Math.min(1, dt * 3);
    e += ((ph === 1 ? S.energy : ph === 2 ? 1 : 0) - e) * Math.min(1, dt * 4);
    hold += ((ph === 2 ? 1 : 0) - hold) * Math.min(1, dt * 4);
    cool += ((ph === 3 ? 1 : 0) - cool) * Math.min(1, dt * 2.5);
    if (ph === 2) hf = S.holdFrac; if (ph === 3) cf = S.coolFrac;
    tf = S.tempFrac;
    tr += dt; td += dt; tc += dt;
  },
  draw(c, S, pass) {
    if (amp < .004 && tr > 2 && td > 2 && tc > 2) return;
    const t = S.reduce ? 0 : S.t, still = S.reduce;
    if (pass === 'under') {
      // a soft warm-up wash inside the dial
      if (e > .01) { c.fillStyle = FX.radial(c, cx, cy, R * 1.25, [rgba(FX.LIVE, .0), rgba(FX.LIVE, .05 * e), rgba(FX.LIVE, .0)]); c.fillRect(cx - R * 1.3, cy - R * 1.3, R * 2.6, R * 2.6); }
    } else if (pass === 'glow') {
      // heating: one calm glow riding the tip of the arc, and a thin halo that breathes
      if (S.phase === 1 && e > .01) {
        const a = FX.arcAngle(tf), x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R, p = still ? 1 : .8 + .2 * Math.sin(t * 3), rad = 10 + 8 * e;
        c.fillStyle = FX.radial(c, x, y, rad, [rgba(WHITE, .85 * p), rgba(FX.LIVE, .35 * p), rgba(FX.LIVE, 0)]); c.beginPath(); c.arc(x, y, rad, 0, TAU); c.fill();
        FX.ring(c, R + 12, rgba(FX.LIVE, (.08 + .14 * e) * (still ? 1 : .75 + .25 * Math.sin(t * 1.6))), 1.5);
      }
      // at temp: one clean ring opens out, the dial rim lights once
      if (tr < 1.1 && !still) {
        const k = tr / 1.1;
        FX.ring(c, R + 12 + eOut(k) * 46, rgba(FX.GOLD, (1 - k) * .7), 2.5 - 1.5 * k);
        FX.ring(c, R, rgba(WHITE, Math.max(0, 1 - tr / .5) * .5), 8);
      }
      // hold: gold ring runs down the time, with a small bright head
      if (hold > .01) {
        FX.ring(c, R + 12, rgba(FX.GOLD, .12 * hold), 2);
        if (hf > .003) {
          const a1 = -Math.PI / 2 + TAU * hf, pulse = S.lastFive && !still ? .6 + .4 * Math.abs(Math.sin(t * Math.PI)) : 1;
          FX.ring(c, R + 12, rgba(FX.GOLD, .9 * hold * pulse), 2.5, -Math.PI / 2, a1);
          if (!still) { const x = cx + Math.cos(a1) * (R + 12), y = cy + Math.sin(a1) * (R + 12); c.fillStyle = FX.radial(c, x, y, 7, [rgba(WHITE, .9 * hold), rgba(FX.GOLD, .4 * hold), rgba(FX.GOLD, 0)]); c.beginPath(); c.arc(x, y, 7, 0, TAU); c.fill(); }
        }
      }
      // done: the ring lets go with one soft ring closing in
      if (td < .9 && !still) { const k = td / .9; FX.ring(c, R + 12 - eOut(k) * 14, rgba(ICE, (1 - k) * .5), 2); }
      // cooldown: a thin cool arc shows the heat left in the glass
      if (cool > .01 && cf > .004) {
        FX.ring(c, R + 12, rgba(ICE, .1 * cool), 1.5);
        FX.ring(c, R + 12, rgba(ICE, .7 * cool), 2, -Math.PI / 2, -Math.PI / 2 + TAU * cf);
      }
      // cool again: one small pulse
      if (tc < 1 && !still) { const k = tc; FX.ring(c, R + 6 + eOut(k) * 14, rgba(FX.LIVE, (1 - k) * .45), 1.5); }
    }
  }
});

})();
// ---- cooldown.js
(function(){
// COOLDOWN (phase 3, every look) + the quiet idle state afterwards.
// Story: hot rim steaming and shedding embers -> heat dies in patches -> snow starts falling, an ice glaze
// creeps round the rim, icicles grow from the card top, snow caps the dial and drifts along the bottom.
// Passes: 'under' cold wash, sinking wisps, heat haze, thermal rings.  'glow' residual rim heat, embers,
// cinders, cool-down ring, glints, idle.  'over' steam, ash, ice shards, glaze, snow cap, icicles, drifts, snow.
const TAU = Math.PI * 2, D = FX.D, cx = FX.cx, cy = FX.cy, R = FX.R, W = FX.W, H = FX.H;
const clamp = FX.clamp, mix = FX.mix;
const rgba = FX.rgba;
// own fixed colours: FX.HOT/LIVE/GOLD are recoloured per look by the host, cooldown heat + ice stay literal
const ICE = [115, 184, 255], WHITE = [255, 255, 255], SNOW = [240, 247, 255], PALE = [200, 226, 255];
const HOT = [255, 120, 40], DEEPRED = [215, 34, 14], WHITEHOT = [255, 208, 136];
const ASH = [150, 162, 176], RINGHOT = [255, 150, 90];
const MAX_STEAM = 30, MAX_ASH = 40, MAX_EMB = 36, MAX_FLASH = 4, MAX_RINGS = 8, MAX_TWK = 5, MAX_DRIP = 3;
const MAX_SNOW = [88, 22, 6];          // small, medium, big
const RING_OUT = R - 9, RING_IN = 60;

let mode = 0;        // 0 off / idle, 1 cooling, 2 after 'cooled' (ice melting, leftovers finishing)
let age = 0, post = 0;
let M = 0;           // master visibility 0..1
let cf = 0;          // heat left 1..0
let heat = 0;        // residual rim heat 1..0 (gone by coolFrac .25)
let cold = 0;        // cold wash amount 0..1
let ice = 0;         // ice/snow build-up 0..1 (sizes)
let iceA = 0;        // ice alpha (drops during the melt)
let iceEnd = 1;
let idleA = 0;
let steamAcc = 0, ashAcc = 0, popT = 0, ringT = 0, twkT = 0, dripT = 0, emI = 0;
const snowAcc = [0, 0, 0], snowN = [0, 0, 0];
const steam = [], ash = [], emb = [], flash = [], rings = [], twk = [], snow = [], drips = [];
let gWarm = null, gCool = null;

// ---------- fixed ice geometry (seeded so it is identical every time and portable) ----------
let seed = 90210;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

function rimNoise(a, t) {
  return .5 + .28 * Math.sin(3 * a + 1.3 + t * .15) + .17 * Math.sin(7 * a + 4.1 - t * .22) + .08 * Math.sin(13 * a + .7 + t * .4);
}
function rimI(a, t) { return clamp((heat * 1.5 - rimNoise(a, t)) / .46); }

// glaze: irregular facets round the rim, inner edge R+3, jagged outer edge R+5..R+9.5
const facets = [];
(function () {
  let a = 0, v0 = R + 5 + rnd() * 4.5; const first = v0;
  while (a < TAU - .001) {
    let a1 = a + (5 + rnd() * 8) * D; if (a1 > TAU - 4 * D) a1 = TAU;
    const v1 = a1 >= TAU ? first : R + 5 + rnd() * 4.5, am = (a + a1) / 2;
    facets.push({ a0: a, a1, v0, v1, am, sh: rnd(), thr: .08 + .5 * (1 - clamp(rimNoise(am, 0))) + rnd() * .12, crease: rnd() < .45 });
    a = a1; v0 = v1;
  }
})();

// icicles along the card top; length limited so they never reach the cool-down ring
const icicles = [];
(function () {
  const xs = [34, 55, 79, 108, 139, 171, 203, 233, 262, 287, 309];
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i] + (rnd() - .5) * 8, dx = Math.abs(x - cx);
    const lim = dx < R + 18 ? cy - Math.sqrt((R + 18) * (R + 18) - dx * dx) - 4 : 80;
    const L = Math.min(lim, 24 + rnd() * 30);
    if (L < 7) continue;
    icicles.push({ x, L, w: 4.5 + L * .12 + rnd() * 2, lean: (rnd() - .5) * 3, d: rnd() * .28 });
  }
})();

// corner ice crystals: fans of elongated hex prisms at 30 degree steps
const shards = [];
(function () {
  for (let ci = 0; ci < 4; ci++) {
    const sx = ci % 2 ? -1 : 1, sy = ci > 1 ? -1 : 1, sc = ci > 1 ? 1 : .72;
    const bx = sx > 0 ? 5 : W - 5, by = sy > 0 ? 5 : H - 5, diag = Math.atan2(sy * 141, sx * 161);
    const defs = [[0, 44, 10], [30, 30, 7.5], [-30, 32, 8], [60, 18, 5.5], [-60, 17, 5.5]];
    for (let j = 0; j < defs.length; j++) {
      const q = defs[j];
      shards.push({ x: bx, y: by, a: diag + q[0] * D + (rnd() - .5) * .08, L: q[1] * sc * (.9 + rnd() * .25), w: q[2] * sc, d: .05 + j * .07 + rnd() * .08, flip: rnd() < .5 });
    }
  }
})();

// still flakes for reduced motion: x, y, r, rot, class
const STILL = [[52, 92, 11, .3, 2], [292, 176, 10, .9, 2], [96, 238, 6, .2, 1], [250, 66, 5.5, .7, 1], [306, 96, 5, .4, 1], [30, 180, 5, 1, 1],
  [70, 150, 2.2, 0, 0], [130, 262, 2.4, .5, 0], [215, 250, 2, .2, 0], [300, 232, 2.3, .8, 0], [272, 128, 2, .1, 0], [40, 232, 2.2, .6, 0]];

// snow lying on things
function driftH(x) {       // front drift height along the card bottom
  const e = Math.max(0, 1 - Math.min(x, W - x) / 70);
  return Math.max(.12, .42 + .3 * Math.sin(x * .021 + 1.2) + .2 * Math.sin(x * .047 + 4) + .1 * Math.sin(x * .11) + .55 * e * e) * 13 * ice;
}
function driftBack(x) {
  return Math.max(.2, .55 + .3 * Math.sin(x * .017 + 3.6) + .18 * Math.sin(x * .039 + .5)) * 19 * ice;
}
const CAPSPAN = 60 * D;
function capGrow() { return clamp((ice - .22) / .7); }
function capH(phi) {       // snow cap thickness at angle phi from 12 o'clock
  const k = Math.abs(phi) / CAPSPAN; if (k >= 1) return 0;
  return 7 * capGrow() * Math.pow(Math.cos(k * Math.PI / 2), .6) * (.78 + .14 * Math.sin(phi * 9 + 1) + .08 * Math.sin(phi * 23 + 2));
}

function clearAll() {
  steam.length = ash.length = emb.length = flash.length = rings.length = twk.length = snow.length = drips.length = 0;
  snowN[0] = snowN[1] = snowN[2] = 0;
}
function begin(S) {
  mode = 1; age = 0; post = 0; M = 0; clearAll();
  steamAcc = ashAcc = 0; snowAcc[0] = snowAcc[1] = 0; snowAcc[2] = .6; popT = .35; ringT = .3; twkT = .4; dripT = 1.2;
  if (!S.reduce) for (let r = RING_OUT - 8; r > RING_IN + 6; r -= 12) rings.push({ r, rot: Math.random() * TAU });
}
function cooled() { if (mode === 1) { mode = 2; post = 0; iceEnd = ice; } }

function spawnSteam(S) {
  if (steam.length >= MAX_STEAM) return;
  emI = (emI + 1 + (Math.random() < .3 ? 1 : 0)) % 5;
  const a = (194 + emI * 38 + Math.sin(S.t * .31 + emI * 1.9) * 11 + (Math.random() - .5) * 9) * D;
  const rr = R + 3 + Math.random() * 5, ca = Math.cos(a), sa = Math.sin(a);
  steam.push({
    x: cx + ca * rr, y: cy + sa * rr, vx: ca * 9, vy: sa * 6 - 30 - Math.random() * 14,
    age: 0, max: 1.9 + Math.random() * .9, r0: 6 + Math.random() * 4, r1: 19 + Math.random() * 13,
    rot: Math.random() * TAU, vr: (Math.random() < .5 ? -1 : 1) * (.5 + Math.random() * 1.1),
    ph: emI * 1.7 + S.t * 1.3 + Math.random() * .6, warm: Math.random() < clamp((cf - .45) * 2.2),
    a: .2 + .17 * cf
  });
}
function spawnAsh() {
  if (ash.length >= MAX_ASH) return;
  const a = Math.random() * TAU, rr = R - 6 + Math.random() * 22;
  ash.push({
    x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr * .96 - 4, vy: 6 + Math.random() * 10,
    term: 20 + Math.random() * 20, ph: Math.random() * TAU, sw: 7 + Math.random() * 10,
    age: 0, max: 2.4 + Math.random() * 1.8, size: 1.2 + Math.random() * 1.4, hot: clamp(cf * 1.3) * (.5 + Math.random() * .5)
  });
}

    }
  } else {
    const f = 1 - clamp((a - .8) / .35), hx = cx, hy = cy + R;      // last drop at the bottom of the rim
    c.fillStyle = FX.radial(c, hx, hy + 10 * (1 - f), 16 * f + 2, [rgba(PURE, .7 * f), rgba(FX.ICE, .35 * f), rgba(FX.ICE, 0)]); c.beginPath(); c.arc(hx, hy + 10 * (1 - f), 16 * f + 2, 0, TAU); c.fill();
  }
  // ring collapsing inward onto the rim, then a faint ripple continuing inside
  const kc = a / .45;
  if (kc < 1) { const r = R + 50 * (1 - eIO(kc)); ringAt(c, cx, cy, r, rgba(col, .16 + .2 * kc), 7); ringAt(c, cx, cy, r, rgba(col, .35 + .55 * kc), 1.4 + 2.6 * kc); }
  else if (a < .7) { const f = 1 - (a - .45) / .25; ringAt(c, cx, cy, R, rgba(mix(col, PURE, .5), .7 * f), 2 + 8 * f); }
  const ki = (a - .42) / .6;
  if (ki > 0 && ki < 1) ringAt(c, cx, cy, R - 30 * eOut(ki), rgba(FX.ICE, .2 * (1 - ki)), 1.5);
}

// ---- COOLED: thin cyan ring springs onto the rim, light sweeps the arc, glints pop in its wake ----
function drawCooled(c, m) {
  const a = m.age;
  const env = clamp(a / .07) * (1 - smooth(a, .75, 1.35));
  if (env > .01) {
    const r = R + 38 * Math.exp(-4.5 * a) * Math.cos(10 * a);          // damped spring = elastic settle
    ringAt(c, cx, cy, r, rgba(FX.LIVE, .2 * env), 6); ringAt(c, cx, cy, r, rgba(mix(FX.LIVE, PURE, .35), .9 * env), 1.5);
    ringAt(c, cx, cy, R, rgba(FX.LIVE, .1 * env), 12);
  }
  const ks = (a - .1) / .75;
  if (ks > 0 && a < 1.15) {
    const f = eIO(clamp(ks)), fade = 1 - smooth(a, .85, 1.15), tail = .26, N = 10;
    c.lineCap = 'butt';
    for (let i = 0; i < N; i++) {                                     // comet tail along the dial arc path
      const f1 = f - tail * i / N, f0 = f - tail * (i + 1) / N; if (f1 <= 0) break;
      const al = Math.pow(1 - i / N, 1.8) * fade;
      c.beginPath(); c.arc(cx, cy, R, FX.arcAngle(Math.max(0, f0)), FX.arcAngle(f1) + .004); c.strokeStyle = rgba(mix(FX.LIVE, PURE, .6 * (1 - i / N)), .75 * al); c.lineWidth = 6.5; c.stroke();
      if (i < 5) { c.beginPath(); c.arc(cx, cy, R, FX.arcAngle(Math.max(0, f0)), FX.arcAngle(f1) + .004); c.strokeStyle = rgba(FX.LIVE, .16 * al); c.lineWidth = 16; c.stroke(); }
    }
    const th = FX.arcAngle(f), hx = cx + Math.cos(th) * R, hy = cy + Math.sin(th) * R;
    c.fillStyle = FX.radial(c, hx, hy, 18, [rgba(PURE, .9 * fade), rgba(FX.LIVE, .4 * fade), rgba(FX.LIVE, 0)]); c.beginPath(); c.arc(hx, hy, 18, 0, TAU); c.fill();
    star(c, hx, hy, 12 * fade, a * 3, PURE, .8 * fade);
  }
  for (let i = 0; i < m.glints.length; i++) {
    const g = m.glints[i], x = cx + Math.cos(g.a) * g.r, y = cy + Math.sin(g.a) * g.r;
    let k = (a - g.t0) / .5;
    if (k > 0 && k < 1) { const s = Math.sin(Math.PI * k); star(c, x, y, g.size * Math.pow(s, .7), g.rot + k * 1.2, i % 3 ? FX.LIVE : PURE, .95 * s); }
    k = (a - g.t0 - (g.twin ? .5 : .62)) / .38;                       // smaller second twinkle
    if (k > 0 && k < 1) { const s = Math.sin(Math.PI * k); star(c, x, y, g.size * .6 * s, g.rot + .8 + k, FX.LIVE, .7 * s); }
  }
}

// ---- START: ignition snap at the arc start (135 deg) ----
function drawStart(c, m) {
  const a = m.age, th0 = 135 * D, px = cx + Math.cos(th0) * R, py = cy + Math.sin(th0) * R;
  const k = clamp(a / .34), f = Math.pow(1 - k, 1.5);
  if (k < 1) {
    ringAt(c, px, py, 3 + 27 * eOut(k), rgba(mix(PURE, FX.LIVE, k), .9 * f), 3 * (1 - k) + .6);
    c.fillStyle = FX.radial(c, px, py, 30, [rgba(PURE, .9 * f), rgba(FX.LIVE, .4 * f), rgba(FX.LIVE, 0)]); c.beginPath(); c.arc(px, py, 30, 0, TAU); c.fill();
    star(c, px, py, 20 * f + 2, .4 + a * 5, PURE, .9 * f);
    ringAt(c, cx, cy, R + 9 * eOut(k), rgba(FX.LIVE, .22 * f), 2);     // whole rim answers faintly
  }
  const k2 = (a - .07) / .36;
  if (k2 > 0 && k2 < 1) ringAt(c, px, py, 2 + 17 * eOut(k2), rgba(FX.GOLD, .7 * Math.pow(1 - k2, 1.5)), 1.4);
  const k3 = clamp(a / .5);                                           // a dash of light races up the first stretch of the arc
  if (k3 < 1) { const f1 = .16 * eOut(k3), f0 = Math.max(0, f1 - .07 * (1 - k3 * .5)); c.lineCap = 'round'; c.beginPath(); c.arc(cx, cy, R, FX.arcAngle(f0), FX.arcAngle(f1) + .003); c.strokeStyle = rgba(mix(PURE, FX.LIVE, k3), .85 * (1 - k3)); c.lineWidth = 5; c.stroke(); }
}

// ---- reduced motion: one calm ring glow per moment, no flash / particles / shake ----
function drawReduced(c, m) {
  const k = clamp(m.age / m.dur), env = Math.sin(Math.PI * k);
  if (m.type === 'ready') {
    c.fillStyle = FX.radial(c, cx, cy, R + 70, [rgba(FX.GOLD, .04 * env), rgba(FX.GOLD, .06 * env), rgba(FX.GOLD, .24 * env), rgba(FX.GOLD, 0)]); c.beginPath(); c.arc(cx, cy, R + 70, 0, TAU); c.fill();
    ringAt(c, cx, cy, R, rgba(FX.GOLD, .5 * env), 4);
  } else if (m.type === 'tick') ringAt(c, cx, cy, R + 12, rgba(FX.GOLD, .45 * env), 3);
  else if (m.type === 'done') { ringAt(c, cx, cy, R, rgba(mix(FX.GOLD, FX.ICE, k), .4 * env), 4); ringAt(c, cx, cy, R, rgba(mix(FX.GOLD, FX.ICE, k), .12 * env), 14); }
  else if (m.type === 'cooled') { ringAt(c, cx, cy, R, rgba(FX.LIVE, .45 * env), 2); ringAt(c, cx, cy, R, rgba(FX.LIVE, .12 * env), 12); }
  else if (m.type === 'start') { const px = cx + Math.cos(135 * D) * R, py = cy + Math.sin(135 * D) * R; c.fillStyle = FX.radial(c, px, py, 22, [rgba(FX.LIVE, .6 * env), rgba(FX.LIVE, 0)]); c.beginPath(); c.arc(px, py, 22, 0, TAU); c.fill(); }
}

const DRAW = {ready: drawReady, tick: drawTick, done: drawDone, cooled: drawCooled, start: drawStart};

FX.add({
  id: 'moments',
  looks: null,
  init() {},
  on(ev, S) {
    if (ev === 'look') { moments.length = 0; sparks.length = 0; return; }
    if (!DUR[ev]) return;
    for (let i = 0; i < moments.length; i++) if (moments[i].type === ev && moments[i].age < .08) return;   // debounce double-fires; later retriggers overlap
    addMoment(ev, S);
    if (ev === 'ready' && !S.reduce) S.kick(8);
    if (ev === 'tick' && !S.reduce) S.kick(2);
  },
  step,
  draw(c, S, pass) {
    if (pass !== 'glow' || (!moments.length && !sparks.length)) return;
    for (let i = 0; i < moments.length; i++) {
      const m = moments[i];
      c.save();
      if (S.reduce) drawReduced(c, m); else DRAW[m.type](c, m);
      c.restore();
    }
    if (!S.reduce) drawSparks(c);
  }
});

})();
FX.layers.forEach(l=>{if(l.id==='cooldown')l.looks=['chimes']});
FX.layers.forEach(l=>{if(l.init){try{l.init(S)}catch(e){}}});
applyPalette();fit();
})();

</script></body></html>
