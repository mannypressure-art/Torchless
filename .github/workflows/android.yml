name: Android build

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.TORCHLESS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
              echo "UPLOAD_KEY_ALIAS=torchless-upload"
            } >> "$GITHUB_ENV"
          else
            echo "No TORCHLESS_KEYSTORE_B64 secret; release builds will be unsigned."
          fi
      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.TORCHLESS_KEY_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.TORCHLESS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: torchless-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
